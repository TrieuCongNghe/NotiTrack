name: Build Release APK NotiTrack
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate or Unzip source code
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -qo "*.zip" -d source_code
            PROJECT_DIR=$(find source_code -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
          else
            PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Release Keystore
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f my-upload-key.jks
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass NotiTrack2026 \
            -keypass NotiTrack2026 \
            -dname "CN=NotiTrack, OU=App, O=NotiTrack, L=HCMC, S=VN, C=VN"

      - name: Build Signed Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: NotiTrack2026
          KEY_PASSWORD: NotiTrack2026
        run: gradle :app:assembleRelease --no-configuration-cache

      - name: Verify APK Signature
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiTrack-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
