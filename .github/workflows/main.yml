name: Build APK NotiTrack
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip -q "*.zip" -d source_code
          PROJECT_DIR=$(find source_code -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

- name: Generate release keystore & accept licenses
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks \
            -storepass notitrack123 -alias upload -keypass notitrack123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NotiTrack,O=Personal,C=VN"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          STORE_PASSWORD: notitrack123
          KEY_PASSWORD: notitrack123
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiTrack-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
