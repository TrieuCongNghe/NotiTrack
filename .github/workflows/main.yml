name: Build APK from ZIP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip -q notitrack.zip -d source_code
          GRADLE_DIR=$(find source_code -name "gradlew" -printf "%h\n" | head -n 1)
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.GRADLE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
